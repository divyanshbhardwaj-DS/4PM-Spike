<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Management Login | DSS-1.0</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    body {
      background-color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .auth-box {
      background: white;
      border-radius: 12px;
      padding: 40px;
      width: 440px;
      max-width: 90vw;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-header h2 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #0f172a;
    }
    .auth-header p {
      font-size: 0.85rem;
      color: #475569;
      margin-top: 4px;
    }
    .error-banner {
      background: #fef2f2;
      border: 1px solid #f87171;
      color: #b91c1c;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body data-portal-role="MANAGEMENT">

  <div class="auth-box">
    <div class="auth-header">
      <div style="width: 48px; height: 48px; background: #ecfdf5; color: #059669; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px;">
        <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
      </div>
      <h2>Managing Team Sign In</h2>
      <p>Campus Operations & Energy Decision Authority</p>
    </div>

    <div id="errorBanner" class="error-banner"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" class="form-control" placeholder="manager1" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
      </div>

      <button type="submit" class="btn btn-success" style="width: 100%; margin-top: 8px;">
        Sign In to Management Dashboard &rarr;
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 0.82rem; color: #475569;">
      <a href="/" style="color: #475569; text-decoration: none;">&larr; Back to Public Portal</a> &bull;
      <a href="/login/electrician" style="color: #059669; text-decoration: none;">Electrician Login</a>
      &bull; <a href="/login/admin" style="color: #475569; text-decoration: none;">Administrator</a>
    </div>
  </div>

  <script src="/static/js/login.js"></script>
</body>
</html>
